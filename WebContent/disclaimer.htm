  <script>

    // The url= query string is only ever compared against the hard-coded
    // literal destinations below. No variable, table entry or parameter value is

    function go() {
	    var iPos = document.URL.indexOf("url=")+4;

      sKey = sKey.substring(0, qPos);
    }
        if (window.opener) {

        } else if (sKey === "http://www.microsoft.com" || sKey === "http://www.microsoft.com/") {
        	window.location.href = "http://www.microsoft.com";
        } else {
        	window.location.href = "index.htm";
        }
        }
    }

    function cl() {
      window.close();
    }

    var iPos = document.URL.indexOf("url=")+4;
    var sKey = document.URL.substring(iPos, document.URL.length);
    var qPos = sKey.indexOf("&");
