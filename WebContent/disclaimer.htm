<html>
<head>
  <title>Altoro Mutual: Link Disclaimer</title>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <style type="text/css">
  <!--
    p { font: 12px verdana, arial, sans-serif; color:#000000; line-height:1.6 }
  -->
  </style>
  <script>

    function go() {
        var iPos = document.URL.indexOf("url=")+4;
        var sDst = document.URL.substring(iPos,document.URL.length);
        // Only allow-listed destinations are followed; the parameter merely
        // selects a branch and no value derived from it is ever assigned to
        // location. Anything else falls back to the local index page.
        var sTarget = 'index.jsp';
        if (sDst === 'http://www.altoromutual.com' || sDst === 'http://www.altoromutual.com/') {
            sTarget = 'http://www.altoromutual.com';
        } else if (sDst === 'http://www.ibm.com' || sDst === 'http://www.ibm.com/') {
            sTarget = 'http://www.ibm.com';
        } else if (sDst === 'http://www.netscape.com' || sDst === 'http://www.netscape.com/') {
            sTarget = 'http://www.netscape.com';
        }
        if (window.opener) {
            window.opener.location.href = sTarget;
            cl();
        } else {
            window.location.href = sTarget;
        }
    }

    function cl() {
      window.close();
    }

	</script>
</head>

<body bgcolor=#FFFFFF link="#5811B0" vlink="#5811B0" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">

  <center>
  <table width=90% border=0>
    <tr>
      <td>
        <p>This hyperlink allows you to access a third party website:
        <br /><br />
        <b id="dstUrl"></b>
        <script>
          (function () {
            var iPos = document.URL.indexOf("url=")+4;
            var sDst = document.URL.substring(iPos,document.URL.length);
            document.getElementById('dstUrl').textContent = sDst;
          })();
        </script>
        <br /><br />
        Please read the privacy policy of the linked website, which
        may differ from the privacy policy of the Altoro Mutual website.
        <br /><br />
        Click OK to continue or Cancel to remain on altoromutual.com.
        </p>
        <a href="#" onclick="go();return false;"><img src="images/ok.gif" id="ok" alt="ok" border="0"></a>
        <a href="#" onclick="cl();return false;"><img src="images/cancel.gif" id="cancel" alt="cancel" border="0"></a>
      </td>
    </tr>
  </table>

  </center>

</body>
</html>
