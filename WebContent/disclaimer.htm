<html>
<head>
  <title>Altoro Mutual: Link Disclaimer</title>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <style type="text/css">
  <!--
    p { font: 12px verdana, arial, sans-serif; color:#000000; line-height:1.6 }
  -->
  </style>
  <script>

    // Destinations this page is allowed to send the user to. The "url" query
    // string parameter is only used as a lookup key into this hard-coded table;
    // it is never assigned to location.href.
    var ROUTES = {
      "netscape": "http://www.netscape.com",
      "microsoft": "http://www.microsoft.com",
      "home": "index.jsp"
    };

    // Returns the value of the "url" parameter of the current page, or "" when
    // the parameter is absent. Used for display and for the allow-list lookup.
    function urlParam() {
      var sValue = "";
      var iStart = document.URL.indexOf("url=");
      if (iStart != -1) {
        sValue = document.URL.substring(iStart + 4, document.URL.length);
        var iAmp = sValue.indexOf("&");
        if (iAmp != -1) {
          sValue = sValue.substring(0, iAmp);
        }
      }
      return sValue;
    }

    // Maps the "url" parameter to a key of ROUTES, falling back to the constant
    // "home" page when the value is not allow-listed. Accepts both the short key
    // ("netscape") and the full URL the static pages link with.
    function routeKey() {
      var sValue = urlParam();
      for (var sName in ROUTES) {
        if (ROUTES.hasOwnProperty(sName) &&
            (sValue == sName || sValue == ROUTES[sName])) {
          return sName;
        }
      }
      return "home";
    }

    // Resolved once - the page URL does not change while the page is open.
    var sKey = routeKey();

    function go() {
        if (window.opener) {
      		window.opener.location.href = ROUTES[sKey];
      		cl();
        } else {
        	window.location.href = ROUTES[sKey];
        }
    }

    function cl() {
      window.close();
    }

    // if redirection is in the application's domain, don't ask for authorization
	if ( ROUTES[sKey].indexOf("http") == 0 && ROUTES[sKey].indexOf(document.location.hostname) != -1 ) {
		if (window.opener) {
      		window.opener.location.href = ROUTES[sKey];
      		cl();
        } else {
        	window.location.href = ROUTES[sKey];
        }
	}

	</script>
</head>

<body bgcolor=#FFFFFF link="#5811B0" vlink="#5811B0" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">

  <center>
  <table width=90% border=0>
    <tr>
      <td>
        <p>This hyperlink allows you to access a third party website:
        <br /><br />
        <b id="destination"></b>
        <script>
          // Fill the placeholder with plain text - no HTML string is built and the
          // value is never parsed as markup.
          document.getElementById("destination").textContent = ROUTES[sKey];
        </script>
        <br /><br />
        Please read the privacy policy of the linked website, which
        may differ from the privacy policy of the Altoro Mutual website.
        <br /><br />
        Click OK to continue or Cancel to remain on altoromutual.com.
        </p>
        <a href="#" onclick="go();return false;"><img src="images/ok.gif" id="ok" alt="ok" border="0"></a>
        <a href="#" onclick="cl();return false;"><img src="images/cancel.gif" id="cancel" alt="cancel" border="0"></a>
      </td>
    </tr>
  </table>

  </center>

</body>
</html>
