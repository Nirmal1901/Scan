<html>
<head>
  <title>Altoro Mutual: Link Disclaimer</title>
  <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
  <style type="text/css">
  <!--
    p { font: 12px verdana, arial, sans-serif; color:#000000; line-height:1.6 }
  -->
  </style>
  <script>

    // Allow-list of redirect destinations. The url= query string is only used to
    // pick a key in this table; it is never used as the redirect target itself.
    var ROUTES = {
      "altoro": "http://altoromutual.com/",
      "ibm": "http://www.ibm.com/",
      "http://www.netscape.com": "http://www.netscape.com",
      "http://www.microsoft.com": "http://www.microsoft.com"
    };

    function go() {
	    var iPos = document.URL.indexOf("url=")+4;
    var sKey = document.URL.substring(iPos, document.URL.length);
    var qPos = sKey.indexOf("&");
    if (qPos != -1) {
      sKey = sKey.substring(0, qPos);
    }
        if (window.opener) {
      		window.opener.location.href = ROUTES[sKey] || "index.htm";
      		cl();
        } else {
        	window.location.href = ROUTES[sKey] || "index.htm";
        }
    }

    function cl() {
      window.close();
    }

    var iPos = document.URL.indexOf("url=")+4;
    var sKey = document.URL.substring(iPos, document.URL.length);
    var qPos = sKey.indexOf("&");
    if (qPos != -1) {
      sKey = sKey.substring(0, qPos);
    }
  	var sDst = ROUTES[sKey] || "index.htm";
    // Destinations are all external literals from the allow-list above; there is
    // no "same domain" shortcut, so the user always sees this warning page first.

	</script>
</head>

<body bgcolor=#FFFFFF link="#5811B0" vlink="#5811B0" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">

  <center>
  <table width=90% border=0>
    <tr>
      <td>
        <p>This hyperlink allows you to access a third party website:
        <br /><br />
        <b><script>document.write(encodeURI(sDst));</script></b>
        <br /><br />
        Please read the privacy policy of the linked website, which
        may differ from the privacy policy of the Altoro Mutual website.
        <br /><br />
        Click OK to continue or Cancel to remain on altoromutual.com.
        </p>
        <a href="#" onclick="go();return false;"><img src="images/ok.gif" id="ok" alt="ok" border="0"></a>
        <a href="#" onclick="cl();return false;"><img src="images/cancel.gif" id="cancel" alt="cancel" border="0"></a>
      </td>
    </tr>
  </table>

  </center>

</body>
</html>
